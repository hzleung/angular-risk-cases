@if (loading()) {
<p>loading...</p>
} @else if (caseDetail(); as c){
<h2>{{c.title}}</h2>
<dl>
  <dt>number</dt>
  <dt>{{c.id}}</dt>
  <dt>status</dt>
  <dd><app-status-badge [status]="c.status" /></dd>
  <dt>Risk Level</dt>
  <dt>{{c.riskLevel}}</dt>
  <dt>Owner</dt>
  <dt>{{c.owner}}</dt>
  <dt>updateAt</dt>
  <dt>{{c.updateAt}}</dt>
</dl>
<h3>Audit Record</h3>
@for (log of caseLogs(); track log) {
<p>{{ log }}</p>
}
} @else {
<p>empty case</p>
<a routerLink="/">Back to list</a>
}
